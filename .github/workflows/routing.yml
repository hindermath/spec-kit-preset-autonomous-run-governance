name: Autonomous offline routing regression
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Bash routing entrypoint (no inference)
        if: runner.os != 'Windows'
        shell: bash
        run: bash tests/test-model-routing.sh
      - name: Native PowerShell regressions (synthetic runner only)
        shell: pwsh
        run: |
          # Isolate fixture-internal expected negative exits from the caller.
          pwsh -NoProfile -File tests/test-model-routing.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File tests/test-autonomous-evidence-integrity.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git rev-parse HEAD
          Get-FileHash scripts/invoke-autonomous-model-phase.ps1 -Algorithm SHA256
          if (@(git status --porcelain --untracked-files=all).Count -ne 0) { throw 'Offline tests changed the repository.' }
